{% if form.non_field_errors %}<p class="error">{{ form.non_field_errors|join:" " }}</p>{% endif %}
{% for field in form %}
  {% if field.is_hidden %}{{ field }}{% else %}
  <label class="field">{{ field.label }}{{ field }}{% if field.help_text %}<small class="meta">{{ field.help_text|safe }}</small>{% endif %}{{ field.errors }}</label>
  {% endif %}
{% endfor %}
